[versions]
application_id = "com.ohyooo.demo"
min_sdk = "23"
target_sdk = "37"
compile_sdk = "37"
version_code = "10"
version_name = "2.10"
compile-minor = "0"

agp = "9.3.1"
kotlin = "2.4.10"
retrofit2 = "3.0.0"


[plugins]
agp = { id = "com.android.application", version.ref = "agp" }
kgp = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]

# Kotlin
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

# AndroidX
appcompat = "androidx.appcompat:appcompat:1.7.1"
coreKtx = "androidx.core:core-ktx:1.19.0"
fragmentKtx = "androidx.fragment:fragment-ktx:1.8.9"
constraintLayout = "androidx.constraintlayout:constraintlayout:2.2.1"
recyclerview = "androidx.recyclerview:recyclerview:1.4.0"

# Squareup
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit2" }
converter = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit2" }
log = "com.squareup.okhttp3:logging-interceptor:5.4.0"

# Third
timber = "com.jakewharton.timber:timber:5.0.1"
