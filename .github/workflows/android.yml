name: Android CI

on:
  push:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease
